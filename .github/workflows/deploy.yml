name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, macOS, X64]
    concurrency:
      group: deploy-tracker-bot
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Синхронизировать исходники
        run: |
          set -euo pipefail
          DEST="$HOME/projects/tracker-bot"
          mkdir -p "$DEST"
          rsync -a --delete --exclude '.git' --exclude '.env' ./ "$DEST/"

      - name: Собрать и поднять контейнер
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILY_SUMMARY_TIME: ${{ secrets.DAILY_SUMMARY_TIME }}
        run: |
          set -euo pipefail
          export PATH="/Applications/Docker.app/Contents/Resources/bin:$PATH"
          cd "$HOME/projects/tracker-bot"
          docker compose up -d --build --force-recreate

      - name: Health check
        run: |
          set -euo pipefail
          echo "Жду запуска контейнеров..."
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8003 || true)
            [ "$code" = "200" ] && echo "API отвечает (попытка $i)" && exit 0
            echo "попытка $i: $code"; sleep 2
          done
          docker logs --tail 50 tracker-bot-api || true
          exit 1
