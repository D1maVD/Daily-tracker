<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Трекер дня v6</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg:       var(--tg-theme-bg-color, #fff);
      --text:     var(--tg-theme-text-color, #000);
      --hint:     var(--tg-theme-hint-color, #8e8e93);
      --btn:      var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #fff);
      --sec:      var(--tg-theme-secondary-bg-color, #f2f2f7);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    button, input, textarea { color: var(--text); font-family: inherit; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 15px; padding-bottom: 80px;
    }

    .nav {
      position: fixed; bottom: 4px; left: 8px; right: 8px;
      background: var(--sec);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.12);
      display: flex; z-index: 100;
      overflow: hidden;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 5px 0 8px; cursor: pointer;
      font-size: 9px; color: var(--hint);
      border: none; background: none; transition: color .15s;
    }
    .nav-item .icon { font-size: 22px; line-height: 1; margin-bottom: 2px; }
    .nav-item.active { color: var(--btn); }

    .page { display: none; padding: 16px; }
    .page.active { display: block; }

    .card {
      background: var(--sec); border-radius: 14px;
      padding: 14px 16px; margin-bottom: 12px;
    }
    .card-title {
      font-size: 11px; font-weight: 600; color: var(--hint);
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px;
    }

    .status-card {
      background: var(--btn); color: var(--btn-text);
      border-radius: 16px; padding: 20px 16px;
      text-align: center; margin-bottom: 12px;
    }
    .status-label { font-size: 12px; opacity: .8; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
    .status-cat   { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .status-time  { font-size: 36px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
    .status-idle  { font-size: 15px; opacity: .85; }

    .btn-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .btn {
      flex: 1; border: none; border-radius: 12px;
      padding: 14px; font-size: 16px; font-weight: 600;
      cursor: pointer; transition: opacity .15s;
    }
    .btn:active { opacity: .7; }
    .btn-start    { background: var(--btn); color: var(--btn-text); }
    .btn-stop     { background: #e53e3e; color: #fff; }
    .btn-disabled { opacity: .35; pointer-events: none; }

    .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .cat-btn {
      border: 2px solid rgba(128,128,128,0.25); border-radius: 12px;
      background: var(--sec); padding: 12px 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      text-align: center; transition: all .15s;
    }
    .cat-btn.selected { border-color: var(--btn); background: var(--btn); color: var(--btn-text); }
    .cat-btn.span2 { grid-column: span 2; }

    .session-item {
      display: flex; align-items: center;
      padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,.06); gap: 10px;
    }
    .session-item:last-child { border-bottom: none; }
    .session-time { font-size: 12px; color: var(--hint); min-width: 44px; }
    .session-info { flex: 1; min-width: 0; }
    .session-cat  { font-weight: 600; font-size: 14px; }
    .session-desc { font-size: 12px; color: var(--hint); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-dur  { font-size: 13px; font-weight: 600; color: var(--hint); white-space: nowrap; }

    .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .total-val { font-size: 17px; font-weight: 700; }

    .week-bars { display: flex; align-items: flex-end; gap: 6px; height: 100px; margin-bottom: 8px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .bar { width: 100%; background: var(--btn); border-radius: 6px 6px 0 0; min-height: 2px; transition: height .3s; opacity: .85; }
    .bar.today { opacity: 1; }
    .bar-label { font-size: 10px; color: var(--hint); }
    .bar-val   { font-size: 10px; font-weight: 600; }

    .cat-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,.06); }
    .cat-row:last-child { border-bottom: none; }
    .cat-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .cat-name { flex: 1; font-size: 14px; }
    .cat-pct  { font-size: 13px; color: var(--hint); }
    .cat-mins { font-size: 13px; font-weight: 600; }

    /* Settings */
    .settings-item {
      display: flex; align-items: center;
      padding: 11px 0; border-bottom: 1px solid rgba(0,0,0,.06); gap: 10px;
    }
    .settings-item:last-child { border-bottom: none; }
    .settings-name { flex: 1; font-size: 15px; }
    .del-btn {
      border: none; background: none; color: #e53e3e;
      font-size: 20px; cursor: pointer; padding: 4px; opacity: .5;
    }
    .del-btn:active { opacity: 1; }

    .add-row { display: flex; gap: 8px; margin-top: 12px; }
    .add-input {
      flex: 1; background: var(--sec); border: none;
      border-radius: 10px; padding: 10px 12px;
      font-size: 15px; color: var(--text); outline: none;
      font-family: inherit;
    }
    .add-btn {
      border: none; border-radius: 10px; background: var(--btn);
      color: var(--btn-text); padding: 10px 16px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .add-btn:active { opacity: .7; }

    .desc-wrap { margin-bottom: 12px; }
    .desc-wrap textarea {
      width: 100%; background: var(--sec); border: none;
      border-radius: 12px; padding: 12px 14px;
      font-size: 15px; color: var(--text); resize: none;
      outline: none; font-family: inherit;
    }

    .period-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .period-tab {
      flex: 1; border: none; border-radius: 10px; padding: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      background: var(--sec); transition: all .15s;
    }
    .period-tab.active { background: var(--btn); color: var(--btn-text); }

    .day-detail { margin-top: 12px; }
    .day-detail-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--hint); text-transform: uppercase; letter-spacing: .5px; }

    .bar-col { cursor: pointer; }
    .bar-col:active .bar { opacity: .6; }

    .empty { text-align: center; color: var(--hint); padding: 24px 0; font-size: 14px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- Today -->
<div class="page active" id="page-today">
  <div class="status-card" id="status-card">
    <div class="status-idle">Нет активной сессии</div>
  </div>

  <div id="start-flow">
    <div class="card">
      <div class="card-title">Категория</div>
      <div class="cat-grid" id="cat-grid"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-start btn-disabled" id="btn-start">▶ Старт</button>
    </div>
  </div>

  <div id="stop-flow" class="hidden">
    <div class="desc-wrap">
      <textarea id="desc-input" rows="3" placeholder="Что сделал? (необязательно)"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-stop" id="btn-stop">⏹ Стоп</button>
    </div>
  </div>

  <div class="card" id="sessions-card">
    <div class="total-row">
      <div class="card-title" style="margin:0">Сегодня</div>
      <div class="total-val" id="total-time">—</div>
    </div>
    <div id="sessions-list"><div class="empty">Нет записей</div></div>
  </div>
</div>

<!-- Week -->
<div class="page" id="page-week">
  <div class="period-tabs">
    <button class="period-tab active" data-period="week">Неделя</button>
    <button class="period-tab" data-period="month">Месяц</button>
    <button class="period-tab" data-period="year">Год</button>
  </div>
  <div class="card">
    <div class="card-title" id="stats-title">Часы за 7 дней</div>
    <div class="week-bars" id="week-bars"></div>
  </div>
  <div class="card hidden" id="day-detail-card">
    <div class="day-detail-title" id="day-detail-title"></div>
    <div id="day-detail-list"></div>
  </div>
  <div class="card">
    <div class="card-title">По категориям</div>
    <div id="cat-breakdown"><div class="empty">Нет данных</div></div>
  </div>
</div>

<!-- Settings -->
<div class="page" id="page-settings">
  <div class="card">
    <div class="card-title">Категории</div>
    <div id="cat-list"><div class="empty">Загрузка...</div></div>
    <div class="add-row">
      <input class="add-input" id="new-cat-input" placeholder="Новая категория..." maxlength="30">
      <button class="add-btn" id="add-cat-btn">+</button>
    </div>
  </div>
</div>

<!-- Nav -->
<nav class="nav">
  <button class="nav-item active" data-page="today">
    <span class="icon">🏠</span>Сегодня
  </button>
  <button class="nav-item" data-page="week">
    <span class="icon">📊</span>Неделя
  </button>
  <button class="nav-item" data-page="settings">
    <span class="icon">⚙️</span>Настройки
  </button>
</nav>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const initData = tg?.initData || "";

  function api(path, body = {}) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", path, true);
      xhr.timeout = 8000;
      xhr.onload = function () {
        resolve({
          ok: this.status >= 200 && this.status < 300,
          status: this.status,
          json: () => { try { return Promise.resolve(JSON.parse(this.responseText)); } catch (e) { return Promise.reject(e); } },
        });
      };
      xhr.onerror = function () { reject(new Error("XHR error [" + path + "]")); };
      xhr.ontimeout = function () { reject(new Error("XHR timeout 8s [" + path + "]")); };
      xhr.send(JSON.stringify({ ...body, init_data: initData }));
    });
  }

  function esc(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function fmtTime(isoStr) {
    if (!isoStr) return "";
    return new Date(isoStr).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  // Nav
  document.querySelectorAll(".nav-item").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("page-" + btn.dataset.page).classList.add("active");
      if (btn.dataset.page === "week") loadStats(currentPeriod);
      if (btn.dataset.page === "settings") loadCategories();
    });
  });

  // Categories
  const DEFAULT_CATS = [
    { id: "d1", name: "💻 Код" },
    { id: "d2", name: "🤝 Митинг" },
    { id: "d3", name: "📚 Обучение" },
    { id: "d4", name: "☕ Перерыв" },
    { id: "d5", name: "🔧 Другое" },
  ];
  let categories = [...DEFAULT_CATS];
  let selectedCat = null;

  async function loadCategories() {
    try {
      const res = await api("/api/categories/list");
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      if (data.categories?.length) categories = data.categories;
    } catch (e) {
      console.warn("Categories fallback to defaults", e);
    }
    renderCatGrid();
    renderCatList();
  }

  function renderCatGrid() {
    const grid = document.getElementById("cat-grid");
    grid.innerHTML = categories.map((c, i) => {
      const isLast = i === categories.length - 1 && categories.length % 2 !== 0;
      return `<button class="cat-btn${isLast ? " span2" : ""}" data-name="${esc(c.name)}">${esc(c.name)}</button>`;
    }).join("");

    grid.querySelectorAll(".cat-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        grid.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedCat = btn.dataset.name;
        document.getElementById("btn-start").classList.remove("btn-disabled");
      });
    });
  }

  function renderCatList() {
    const list = document.getElementById("cat-list");
    if (!categories.length) {
      list.innerHTML = `<div class="empty">Нет категорий</div>`;
      return;
    }
    list.innerHTML = categories.map(c => `
      <div class="settings-item">
        <div class="settings-name">${esc(c.name)}</div>
        <button class="del-btn" data-id="${esc(c.id)}">✕</button>
      </div>`).join("");

    list.querySelectorAll(".del-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        await api("/api/categories/delete", { cat_id: parseInt(btn.dataset.id) });
        loadCategories();
      });
    });
  }

  document.getElementById("add-cat-btn").addEventListener("click", async () => {
    const input = document.getElementById("new-cat-input");
    const name = input.value.trim();
    if (!name) return;
    await api("/api/categories/add", { name });
    input.value = "";
    loadCategories();
  });

  document.getElementById("new-cat-input").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("add-cat-btn").click();
  });

  // Start
  document.getElementById("btn-start").addEventListener("click", async () => {
    if (!selectedCat) return;
    const btn = document.getElementById("btn-start");
    btn.textContent = "...";
    try {
      const res = await api("/api/start", { category: selectedCat });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert("Ошибка: " + (err.detail || res.status));
        btn.textContent = "▶ Старт";
        return;
      }
      await loadToday();
      btn.textContent = "▶ Старт";
    } catch (e) {
      alert("Ошибка соединения: " + e.message);
      btn.textContent = "▶ Старт";
    }
  });

  // Stop
  document.getElementById("btn-stop").addEventListener("click", async () => {
    const desc = document.getElementById("desc-input").value.trim();
    const btn = document.getElementById("btn-stop");
    btn.textContent = "...";
    try {
      const res = await api("/api/stop", { description: desc });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert("Ошибка: " + (err.detail || res.status));
        btn.textContent = "⏹ Стоп";
        return;
      }
      document.getElementById("desc-input").value = "";
      await loadToday();
      btn.textContent = "⏹ Стоп";
    } catch (e) {
      alert("Ошибка соединения: " + e.message);
      btn.textContent = "⏹ Стоп";
    }
  });

  // Timer
  let timerInterval = null;
  let activeStart = null;

  function startTimer(startIso) {
    activeStart = new Date(startIso);
    clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
    updateTimer();
  }

  function updateTimer() {
    const elapsed = Math.floor((Date.now() - activeStart) / 1000);
    const h = Math.floor(elapsed / 3600);
    const m = Math.floor((elapsed % 3600) / 60);
    const s = elapsed % 60;
    const str = h > 0
      ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
      : `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    const el = document.getElementById("timer-val");
    if (el) el.innerText = str;
  }

  function fmtMins(m) {
    const h = Math.floor(m / 60), mm = m % 60;
    return h > 0 ? `${h}ч ${mm}м` : `${mm}м`;
  }

  async function loadToday() {
    const res = await api("/api/today");
    if (!res.ok) return;
    const data = await res.json();

    const card = document.getElementById("status-card");
    const startFlow = document.getElementById("start-flow");
    const stopFlow = document.getElementById("stop-flow");

    if (data.active) {
      clearInterval(timerInterval);
      card.innerHTML = `
        <div class="status-label">Идёт сессия</div>
        <div class="status-cat">${esc(data.active.category)}</div>
        <div class="status-time" id="timer-val">00:00</div>`;
      startTimer(data.active.start);
      startFlow.classList.add("hidden");
      stopFlow.classList.remove("hidden");
    } else {
      clearInterval(timerInterval);
      card.innerHTML = `<div class="status-idle">Нет активной сессии</div>`;
      startFlow.classList.remove("hidden");
      stopFlow.classList.add("hidden");
      selectedCat = null;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("selected"));
      document.getElementById("btn-start").classList.add("btn-disabled");
    }

    document.getElementById("total-time").innerText =
      data.total_minutes > 0 ? fmtMins(data.total_minutes) : "—";

    const list = document.getElementById("sessions-list");
    if (!data.sessions.length) {
      list.innerHTML = `<div class="empty">Нет записей</div>`;
    } else {
      list.innerHTML = data.sessions.map(s => `
        <div class="session-item">
          <div class="session-time">${fmtTime(s.start)}</div>
          <div class="session-info">
            <div class="session-cat">${esc(s.category)}</div>
            ${s.description ? `<div class="session-desc">${esc(s.description)}</div>` : ""}
          </div>
          <div class="session-dur">${fmtMins(s.duration)}</div>
          <button class="del-btn" data-id="${esc(s.id)}">✕</button>
        </div>`).join("");

      list.querySelectorAll(".del-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          await api("/api/sessions/delete", { session_id: parseInt(btn.dataset.id) });
          loadToday();
        });
      });
    }
  }

  // Week
  const CAT_COLORS = ["#4299e1","#ed8936","#48bb78","#a0aec0","#9f7aea","#f56565","#38b2ac"];
  const PERIOD_TITLES = { week: "Часы за 7 дней", month: "Часы за 30 дней", year: "Часы за год" };
  let currentPeriod = "week";
  let statsData = [];

  // Period tabs
  document.querySelectorAll(".period-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".period-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentPeriod = btn.dataset.period;
      document.getElementById("day-detail-card").classList.add("hidden");
      loadStats(currentPeriod);
    });
  });

  async function loadStats(period = "week") {
    const res = await api("/api/stats", { period });
    const data = await res.json();
    statsData = data.bars;
    document.getElementById("stats-title").textContent = PERIOD_TITLES[period];
    renderBars(statsData, period);
    renderBreakdown(statsData);
  }

  function renderBars(bars, period) {
    const maxMins = Math.max(...bars.map(b => b.total_minutes), 1);
    const today = new Date().toISOString().slice(0, 10);

    document.getElementById("week-bars").innerHTML = bars.map((b, i) => {
      const pct = Math.round((b.total_minutes / maxMins) * 100);
      const isToday = b.is_current;
      const h = Math.floor(b.total_minutes / 60);
      const val = b.total_minutes > 0 ? (h > 0 ? `${h}ч` : `${b.total_minutes}м`) : "";
      return `
        <div class="bar-col" data-date="${b.date}" data-idx="${i}">
          <div class="bar-val">${val}</div>
          <div class="bar${isToday ? " today" : ""}" style="height:${Math.max(pct,2)}%"></div>
          <div class="bar-label">${b.label}</div>
        </div>`;
    }).join("");

    document.querySelectorAll(".bar-col").forEach(col => {
      col.addEventListener("click", () => openDayDetail(col.dataset.date));
    });
  }

  async function openDayDetail(dateStr) {
    const res = await api("/api/day", { date: dateStr });
    const data = await res.json();
    const card = document.getElementById("day-detail-card");
    const title = document.getElementById("day-detail-title");
    const list = document.getElementById("day-detail-list");

    const dt = new Date(dateStr + "T00:00:00");
    const label = dt.toLocaleDateString("ru", { day: "numeric", month: "long" });
    title.textContent = `${label} — ${fmtMins(data.total_minutes)}`;
    card.classList.remove("hidden");

    if (!data.sessions.length) {
      list.innerHTML = `<div class="empty">Нет записей</div>`;
      return;
    }
    list.innerHTML = data.sessions.map(s => `
      <div class="session-item">
        <div class="session-time">${fmtTime(s.start)}</div>
        <div class="session-info">
          <div class="session-cat">${esc(s.category)}</div>
          ${s.description ? `<div class="session-desc">${esc(s.description)}</div>` : ""}
        </div>
        <div class="session-dur">${fmtMins(s.duration)}</div>
      </div>`).join("");

    card.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function renderBreakdown(bars) {
    const catTotals = {};
    bars.forEach(b => {
      if (b.categories) Object.entries(b.categories).forEach(([cat, mins]) => {
        catTotals[cat] = (catTotals[cat] || 0) + mins;
      });
    });
    const totalAll = Object.values(catTotals).reduce((a, b) => a + b, 0);
    const breakdown = document.getElementById("cat-breakdown");
    if (!totalAll) { breakdown.innerHTML = `<div class="empty">Нет данных</div>`; return; }
    const sorted = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
    breakdown.innerHTML = sorted.map(([cat, mins], i) => {
      const pct = Math.round(mins / totalAll * 100);
      return `
        <div class="cat-row">
          <div class="cat-dot" style="background:${CAT_COLORS[i % CAT_COLORS.length]}"></div>
          <div class="cat-name">${cat}</div>
          <div class="cat-pct">${pct}%</div>
          <div class="cat-mins">${fmtMins(mins)}</div>
        </div>`;
    }).join("");
  }

  // Init
  loadCategories().then(() => loadToday());
  setInterval(loadToday, 30000);
</script>
